name: Deploy Frontend to GitHub Pages (Optional Preview)

on:
  workflow_dispatch: # Manual trigger only so production hosting is never changed automatically

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Client Dependencies
        run: |
          npm --prefix client install

      - name: Build Vite Client for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          VITE_FIREBASE_PROJECT_ID: "any-video-to"
          VITE_FIREBASE_APP_ID: "1:1016314223204:web:1bfeb551f24af9a6d81d71"
          VITE_FIREBASE_AUTH_DOMAIN: "any-video-to.firebaseapp.com"
          VITE_FIREBASE_STORAGE_BUCKET: "any-video-to.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1016314223204"
          VITE_FIREBASE_MEASUREMENT_ID: "G-57YH9NHCZ7"
          VITE_SUPABASE_URL: "https://tboopdrzolsjfdanmqww.supabase.co"
        run: |
          npm --prefix client run build
          # SPA routing fallback: copy index.html to 404.html for GitHub Pages deep linking
          cp client/dist/index.html client/dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
